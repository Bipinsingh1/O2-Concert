<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buy tickets for Dua Lipa Live at The O2 Arena, London – 30 November 2026.">
  <title>{% block title %}The O2 Arena – Dua Lipa 2026{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/shared/style.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

  {% include "layouts/navbar.html" %}

  <main class="flex-grow-1">
    <div class="container py-5">
      {% include "includes/messages.html" %}
      {% block content %}{% endblock %}
    </div>
  </main>

  {% include "layouts/footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% load static %}
  <script src="{% static 'js/shared/utils.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
